<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Miel pura y artesanal del monte nativo de Córdoba. Directa desde Tierra del Fuego.">
    <meta name="og:title" content="AMBAR Patagonia - Miel Pura y Artesanal">
    <meta name="og:description" content="Miel pura y artesanal del monte nativo de Córdoba. Directa desde Tierra del Fuego.">
    <meta name="og:image" content="https://selknanshadow.github.io/ambar-patagonia/logo_ambar.jpg">
    <title>AMBAR Patagonia - Miel Pura y Artesanal</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #E5A93C;
            --primary-hover: #cb9027;
            --primary-light: #FFF8EE;
            --dark: #231815;
            --light: #FAF7F2;
            --text: #42352B;
            --text-light: #6E5E52;
            --accent: #B86B27;
            --shadow-sm: 0 4px 15px rgba(35, 24, 21, 0.04);
            --shadow-md: 0 10px 30px rgba(35, 24, 21, 0.08);
            --shadow-lg: 0 20px 40px rgba(35, 24, 21, 0.12);
            --radius-md: 20px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.7;
            color: var(--text);
            background: var(--light);
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.02em;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* HEADER */
        header {
            background: rgba(35, 24, 21, 0.92);
            backdrop-filter: blur(12px);
            color: white;
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: var(--shadow-sm);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 48px;
            width: auto;
            border-radius: 8px;
        }

        .nav {
            display: flex;
            gap: 2.5rem;
        }

        .nav a {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            font-weight: 500;
            position: relative;
            padding: 4px 0;
            text-decoration: none;
        }

        .nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .nav a:hover::after {
            width: 100%;
        }

        /* HERO */
        .hero {
            background: linear-gradient(135deg, rgba(26, 16, 12, 0.3) 0%, rgba(46, 31, 27, 0.3) 100%),
                        url('portada.jpg') center/cover no-repeat;
            color: white;
            padding: 100px 20px 110px;
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero img {
            height: 120px;
            width: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
        }

        .hero h1 {
            font-size: clamp(2.4rem, 5vw, 3.8rem);
            margin-bottom: 0.8rem;
            font-weight: 700;
            line-height: 1.15;
        }

        .hero .tagline {
            font-size: clamp(1.1rem, 2vw, 1.35rem);
            color: #F4A030;
            margin-bottom: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .hero p {
            font-size: 1.05rem;
            max-width: 680px;
            margin: 0 auto 2.5rem;
            line-height: 1.8;
            color: #FFFFFF;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .cta-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, #D49320 100%);
            color: var(--dark);
            padding: 16px 36px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 8px 25px rgba(229, 169, 60, 0.3);
            text-decoration: none;
            cursor: pointer;
        }

        .cta-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(229, 169, 60, 0.45);
        }

        /* DIFERENCIAL */
        .diferencial {
            padding: 90px 20px;
            background: linear-gradient(135deg, rgba(35, 24, 21, 0.75) 0%, rgba(46, 31, 27, 0.75) 100%),
                        url('portada2.jpg') center/cover no-repeat;
            position: relative;
        }

        .diferencial h2 {
            text-align: center;
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            margin-bottom: 3.5rem;
            color: white;
            font-weight: 700;
            position: relative;
        }

        .diferencial h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background: #F4A030;
            margin: 12px auto 0;
            border-radius: 2px;
        }

        .diferencial > .container > div {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            font-size: 1.15rem;
            color: #E0D5C8;
            line-height: 1.8;
        }

        .diferencial p:first-child {
            color: white;
            font-weight: 600;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .diferencial p:last-child {
            color: #F4A030;
            font-weight: 700;
            font-size: 1.2rem;
            margin-top: 1.5rem;
        }

        /* PROCESO */
        .proceso {
            padding: 90px 20px;
            background: #FFF0C9;
        }

        .proceso h2 {
            text-align: center;
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            margin-bottom: 3.5rem;
            color: var(--dark);
            font-weight: 700;
        }

        .proceso h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background: var(--primary);
            margin: 12px auto 0;
            border-radius: 2px;
        }

        .proceso-contenido {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .proceso-texto p {
            margin-bottom: 1.4rem;
            line-height: 1.9;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--dark);
        }

        .proceso-visual {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        .proceso-paso {
            background: white;
            padding: 1.4rem 1.8rem;
            border-radius: var(--radius-md);
            text-align: left;
            border: 1px solid rgba(0,0,0,0.04);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            transition: transform 0.3s ease;
        }

        .proceso-paso:hover {
            transform: translateX(6px);
            box-shadow: var(--shadow-md);
        }

        .paso-numero {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            min-width: 46px;
            background: var(--primary-light);
            color: var(--primary-hover);
            border: 2px solid var(--primary);
            border-radius: 50%;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .proceso-paso p {
            margin: 0;
            color: var(--text);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .proceso-paso strong {
            display: block;
            font-size: 1.05rem;
            color: var(--dark);
            margin-bottom: 2px;
        }

        /* VARIEDADES */
        .variedades {
            padding: 90px 20px;
            background: white;
        }

        .variedades h2 {
            text-align: center;
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            margin-bottom: 3.5rem;
            color: var(--dark);
            font-weight: 700;
        }

        .variedades h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background: var(--primary);
            margin: 12px auto 0;
            border-radius: 2px;
        }

        .grid-variedades {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.2rem;
            max-width: 1140px;
            margin: 0 auto;
        }

        .variedad-card {
            background: white;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .variedad-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .variedad-imagen {
            width: 100%;
            height: 220px;
            position: relative;
            overflow: hidden;
            background: var(--light);
        }

        .variedad-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .variedad-card:hover .variedad-imagen img {
            transform: scale(1.08);
        }

        .variedad-info {
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .variedad-info h3 {
            color: var(--dark);
            font-size: 1.35rem;
            margin-bottom: 0.2rem;
            font-weight: 700;
        }

        .variedad-flor {
            color: var(--accent);
            font-size: 0.88rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.8rem;
        }

        .variedad-desc {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 1.5rem;
            line-height: 1.6;
            flex-grow: 1;
        }

        .variedad-precio {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--dark);
            background: var(--primary-light);
            padding: 10px 14px;
            border-radius: 12px;
            text-align: center;
            border: 1px dashed rgba(229, 169, 60, 0.6);
        }

        /* TESTIMONIOS */
        .testimonios {
            padding: 90px 20px;
            background: var(--light);
        }

        .testimonios h2 {
            text-align: center;
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            margin-bottom: 3.5rem;
            color: var(--dark);
            font-weight: 700;
        }

        .testimonios h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background: var(--primary);
            margin: 12px auto 0;
            border-radius: 2px;
        }

        .testimonios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1050px;
            margin: 0 auto;
        }

        .testimonio {
            background: white;
            padding: 2.2rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.04);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .testimonio p:first-child {
            font-style: italic;
            margin-bottom: 1.5rem;
            color: var(--text);
            position: relative;
            z-index: 1;
            font-size: 0.98rem;
        }

        .testimonio-autor {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* FORMULARIO JOTFORM */
        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(229, 169, 60, 0.7);
            }
            70% {
                box-shadow: 0 0 0 20px rgba(229, 169, 60, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(229, 169, 60, 0);
            }
        }

        .formulario-jotform {
            padding: 90px 20px;
            background: var(--light);
        }

        .formulario-wrapper {
            animation: pulse-glow 2.5s infinite;
            border: 3px solid var(--primary);
            border-radius: var(--radius-md);
            padding: 2.5rem;
            background: white;
            max-width: 700px;
            margin: 0 auto;
        }

        /* ENVIOS */
        .envios {
            padding: 80px 20px;
            background: white;
        }

        .envios h2 {
            text-align: center;
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            margin-bottom: 3.5rem;
            color: var(--dark);
            font-weight: 700;
        }

        .envios h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background: var(--primary);
            margin: 12px auto 0;
            border-radius: 2px;
        }

        .envios-info {
            max-width: 750px;
            margin: 0 auto;
            background: linear-gradient(135deg, #FFFFFF 0%, var(--primary-light) 100%);
            padding: 3rem 2.5rem;
            border-radius: var(--radius-md);
            text-align: center;
            border: 1px solid rgba(229, 169, 60, 0.3);
            box-shadow: var(--shadow-md);
        }

        .envios-info p {
            margin-bottom: 1.2rem;
            font-size: 1.05rem;
            color: var(--text);
        }

        .envios-info p:last-child {
            margin-bottom: 0;
            font-weight: 600;
            color: var(--accent);
        }

        /* FOOTER */
        footer {
            background: var(--dark);
            color: white;
            padding: 80px 20px 30px;
            text-align: center;
            position: relative;
        }

        footer img {
            height: 80px;
            width: auto;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
            opacity: 0.9;
        }

        .footer-content {
            max-width: 650px;
            margin: 0 auto 2.5rem;
        }

        .footer-content h3 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 0.8rem;
        }

        .footer-content p {
            color: #C2B3A5;
            font-size: 1.05rem;
        }

        .footer-cta {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .footer-cta a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 26px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .footer-cta a:nth-child(1) {
            background: #25D366;
            border-color: #25D366;
            color: white;
        }

        .footer-cta a:nth-child(1):hover {
            background: #20BA5A;
            border-color: #20BA5A;
            transform: translateY(-2px);
        }

        .footer-cta a:nth-child(2) {
            background: #E4405F;
            border-color: #E4405F;
            color: white;
        }

        .footer-cta a:nth-child(2):hover {
            background: #D43456;
            border-color: #D43456;
            transform: translateY(-2px);
        }

        .sociales {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .sociales a {
            color: #A08D7D;
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
        }

        .sociales a:hover {
            color: var(--primary);
        }

        .footer-bottom {
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 2rem;
            font-size: 0.88rem;
            color: #8C7B6C;
        }

        .footer-bottom p {
            margin-bottom: 0.4rem;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .proceso-contenido {
                grid-template-columns: 1fr;
                gap: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            header .container {
                flex-direction: column;
                gap: 1rem;
            }

            .nav {
                gap: 1.5rem;
            }

            .hero {
                padding: 70px 20px 80px;
            }

            .proceso-paso {
                padding: 1rem;
            }

            .paso-numero {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .footer-cta {
                flex-direction: column;
                max-width: 300px;
                margin-left: auto;
                margin-right: auto;
            }

            .footer-cta a {
                justify-content: center;
            }

            .container {
                padding: 0 16px;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="container">
            <div class="logo">
                <img src="logo_ambar.jpg" alt="AMBAR Logo">
            </div>
            <nav class="nav">
                <a href="#variedades">Variedades</a>
                <a href="#envios">Envíos</a>
                <a href="#contacto">Contacto</a>
            </nav>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="container">
            <img src="logo_ambar.jpg" alt="AMBAR Logo">
