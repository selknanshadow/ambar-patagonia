<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mieles monofloral de las sierras de Córdoba: Mistol, Algarrobo, Acacia, Romero, Atamisky, Jarilla. Directas desde Tierra del Fuego.">
    <meta name="og:title" content="AMBAR Patagonia - Miel Pura y Artesanal">
    <meta name="og:description" content="Miel pura y artesanal del monte nativo de Córdoba. Directa desde Tierra del Fuego.">
    <meta name="og:image" content="https://selknanshadow.github.io/ambar-patagonia/logo_ambar.jpg">
    <title>AMBAR Patagonia - Miel Premium de Córdoba</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #E5A93C;
            --primary-hover: #cb9027;
            --primary-light: #FFF8EE;
            --dark: #231815;
            --dark-surface: #2E1F1B;
            --light: #FAF7F2;
            --text: #42352B;
            --text-light: #6E5E52;
            --accent: #B86B27;
            --card-bg: #FFFFFF;
            --shadow-sm: 0 4px 15px rgba(35, 24, 21, 0.04);
            --shadow-md: 0 10px 30px rgba(35, 24, 21, 0.08);
            --shadow-lg: 0 20px 40px rgba(35, 24, 21, 0.12);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 30px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.7;
            color: var(--text);
            background: var(--light);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.02em;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        a:hover {
            color: var(--accent);
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* HEADER */
        header {
            background: rgba(35, 24, 21, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white;
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: var(--shadow-sm);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo img {
            height: 48px;
            width: auto;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .logo img:hover {
            transform: scale(1.03);
        }

        .nav {
            display: flex;
            gap: 2.5rem;
        }

        .nav a {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            font-weight: 500;
            position: relative;
            padding: 4px 0;
        }

        .nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .nav a:hover {
            color: white;
        }

        .nav a:hover::after {
            width: 100%;
        }

        /* HERO */
        .hero {
            background: linear-gradient(135deg, rgba(26, 16, 12, 0.3) 0%, rgba(46, 31, 27, 0.3) 100%),
                        url('portada.jpg') center/cover no-repeat;
            color: white;
            padding: 100px 20px 110px;
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l25.98 15v30L30 60 4.02 45V15z' fill-opacity='0.02' fill='%23ffffff' fill-rule='evenodd'/%3E%3C/svg%3E");
            opacity: 0.6;
            pointer-events: none;
        }

        .hero h1 {
            font-size: clamp(2.4rem, 5vw, 3.8rem);
            margin-bottom: 0.8rem;
            font-weight: 700;
            line-height: 1.15;
            background: linear-gradient(180deg, #FFFFFF 0%, #F3E5D8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero .tagline {
            font-size: clamp(1.1rem, 2vw, 1.35rem);
            color: #F4A030;
            margin-bottom: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .hero p {
            font-size: 1.05rem;
            max-width: 680px;
            margin: 0 auto 2.5rem;
            line-height: 1.8;
            color: #FFFFFF;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .hero p strong {
            color: #FFF;
        }

        .cta-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, #D49320 100%);
            color: var(--dark);
            padding: 16px 36px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            box-shadow: 0 8px 25px rgba(229, 169, 60, 0.3);
        }

        .cta-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(229, 169, 60, 0.45);
            color: var(--dark);
            background: linear-gradient(135deg, #f0b243 0%, var(--primary) 100%);
        }

        /* DIFERENCIAL */
        .diferencial {
            padding: 90px 20px;
            background: linear-gradient(135deg, rgba(35, 24, 21, 0.75) 0%, rgba(46, 31, 27, 0.75) 100%),
                        url('portada2.jpg') center/cover no-repeat;
            position: relative;
        }

        .diferencial h2, 
        .proceso h2, 
        .variedades h2, 
        .testimonios h2, 
        .envios h2 {
            text-align: center;
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            margin-bottom: 3.5rem;
            color: var(--dark);
            font-weight: 700;
            position: relative;
        }

        .diferencial h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background: #F4A030;
            margin: 12px auto 0;
            border-radius: 2px;
        }

        .proceso h2::after, 
        .variedades h2::after, 
        .testimonios h2::after, 
        .envios h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background: var(--primary);
            margin: 12px auto 0;
            border-radius: 2px;
        }

        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            max-width: 950px;
            margin: 0 auto;
        }

        .comparison-item {
            padding: 2.8rem 2.2rem;
            border-radius: var(--radius-md);
            text-align: left;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .comparison-item.ambar {
            background: var(--primary-light);
            border: 2px solid rgba(229, 169, 60, 0.4);
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .comparison-item.ambar::before {
            content: 'RECOMENDADO';
            position: absolute;
            top: -14px;
            right: 25px;
            background: var(--primary);
            color: var(--dark);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        .comparison-item.otros {
            background: #F8F9FA;
            border: 1px solid #E2E8F0;
        }

        .comparison-item h3 {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            color: var(--dark);
            font-weight: 700;
        }

        .comparison-item ul {
            list-style: none;
        }

        .comparison-item li {
            padding: 0.6rem 0;
            padding-left: 1.8rem;
            position: relative;
            color: var(--text-light);
            font-size: 0.98rem;
        }

        .ambar li {
            color: var(--text);
            font-weight: 500;
        }

        .ambar li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: 900;
            font-size: 1.1rem;
        }

        .otros li:before {
            content: "✕";
            position: absolute;
            left: 0;
            color: #A0AEC0;
            font-size: 0.9rem;
        }

        /* PROCESO */
        .proceso {
            padding: 90px 20px;
            background: #FFF0C9;
        }

        .proceso-contenido {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .proceso-texto p {
            margin-bottom: 1.4rem;
            line-height: 1.8;
            color: var(--text-light);
            font-size: 1.02rem;
        }

        @media (max-width: 1024px) {
            .proceso-contenido {
                grid-template-columns: 1fr;
                gap: 2.5rem;
            }

            .proceso-visual {
                grid-template-columns: 1fr !important;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 16px;
            }

            .proceso-contenido {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .proceso-paso {
                padding: 1rem !important;
            }

            .paso-numero {
                width: 40px !important;
                height: 40px !important;
                font-size: 1rem !important;
            }
        }

        .proceso-texto strong {
            color: var(--dark);
        }

        .proceso-visual {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        .proceso-paso {
            background: white;
            padding: 1.4rem 1.8rem;
            border-radius: var(--radius-sm);
            text-align: left;
            border: 1px solid rgba(0,0,0,0.04);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            transition: transform 0.3s ease;
        }

        .proceso-paso:hover {
            transform: translateX(6px);
            box-shadow: var(--shadow-md);
        }

        .paso-numero {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            min-width: 46px;
            background: var(--primary-light);
            color: var(--primary-hover);
            border: 2px solid var(--primary);
            border-radius: 50%;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0;
        }

        .proceso-paso p {
            font-size: 0.95rem;
            margin: 0;
            color: var(--text);
            line-height: 1.4;
        }

        .proceso-paso p strong {
            display: block;
            font-size: 1.05rem;
            color: var(--dark);
            margin-bottom: 2px;
        }

        /* VARIEDADES */
        .variedades {
            padding: 90px 20px;
            background: white;
        }

        .grid-variedades {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.2rem;
            max-width: 1140px;
            margin: 0 auto;
        }

        .variedad-card {
            background: white;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .variedad-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .variedad-imagen {
            width: 100%;
            height: 220px;
            position: relative;
            overflow: hidden;
            background: var(--light);
        }

        .variedad-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .variedad-card:hover .variedad-imagen img {
            transform: scale(1.08);
        }

        .variedad-info {
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .variedad-info h3 {
            color: var(--dark);
            font-size: 1.35rem;
            margin-bottom: 0.2rem;
            font-weight: 700;
        }

        .variedad-flor {
            color: var(--accent);
            font-size: 0.88rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.8rem;
        }

        .variedad-desc {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 1.5rem;
            line-height: 1.6;
            flex-grow: 1;
        }

        .variedad-precio {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--dark);
            background: var(--primary-light);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            text-align: center;
            border: 1px dashed rgba(229, 169, 60, 0.6);
            letter-spacing: -0.2px;
        }

        /* TESTIMONIOS */
        .testimonios {
            padding: 90px 20px;
            background: var(--light);
        }

        .testimonios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1050px;
            margin: 0 auto;
        }

        .testimonio {
            background: white;
            padding: 2.2rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.04);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .testimonio::before {
            content: """;
            font-family: Georgia, serif;
            font-size: 4rem;
            color: var(--primary);
            opacity: 0.3;
            position: absolute;
            top: 10px;
            left: 20px;
            line-height: 1;
        }

        .testimonio p:first-child {
            font-style: italic;
            margin-bottom: 1.5rem;
            color: var(--text);
            position: relative;
            z-index: 1;
            font-size: 0.98rem;
        }

        .testimonio-autor {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ENVIOS */
        .envios {
            padding: 80px 20px;
            background: white;
        }

        .envios-info {
            max-width: 750px;
            margin: 0 auto;
            background: linear-gradient(135deg, #FFFFFF 0%, var(--primary-light) 100%);
            padding: 3rem 2.5rem;
            border-radius: var(--radius-md);
            text-align: center;
            border: 1px solid rgba(229, 169, 60, 0.3);
            box-shadow: var(--shadow-md);
        }

        .envios-info p {
            margin-bottom: 1.2rem;
            font-size: 1.05rem;
            color: var(--text);
        }

        .envios-info p:last-child {
            margin-bottom: 0;
            font-weight: 600;
            color: var(--accent);
        }

        /* FOOTER */
        footer {
            background: var(--dark);
            color: white;
            padding: 80px 20px 30px;
            text-align: center;
            position: relative;
        }

        .footer-content {
            max-width: 650px;
            margin: 0 auto 2.5rem;
        }

        .footer-content h3 {
            font-size: 1.8rem;
            color: var(--primary) !important;
            margin-bottom: 0.8rem;
        }

        .footer-content p {
            color: #C2B3A5;
            font-size: 1.05rem;
        }

        .footer-cta {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .footer-cta a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            padding: 12px 26px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .footer-cta a:nth-child(1) {
            background: #25D366;
            border-color: #25D366;
            color: white;
        }

        .footer-cta a:nth-child(1):hover {
            background: #20BA5A;
            border-color: #20BA5A;
        }

        .footer-cta a:nth-child(2) {
            background: #E4405F;
            border-color: #E4405F;
            color: white;
        }

        .footer-cta a:nth-child(2):hover {
            background: #D43456;
            border-color: #D43456;
        }

        .sociales {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .sociales a {
            color: #A08D7D;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .sociales a:hover {
            color: var(--primary);
        }

        .footer-bottom {
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 2rem;
            font-size: 0.88rem;
            color: #8C7B6C;
        }

        /* ANIMACIÓN FORMULARIO */
        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 0 0 rgba(229, 169, 60, 0.7);
            }
            70% {
